  <path d="M12 5L5 8.5v4.5c0 4.2 2.9 8.1 7 9.1 4.1-1 7-4.9 7-9.1V8.5L12 5z" fill="#0f172a" opacity="0.4" />
  
  <!-- Alert Triangle Glow -->
  <polygon points="12,7.5 17.5,17 6.5,17" fill="url(#glowGrad)" />
  <polygon points="12,9.5 16,16 8,16" fill="#0f172a" />
  
  <!-- Pulse Indicator -->
  <circle cx="12" cy="13.5" r="1.5" fill="#ef4444" />
  <rect x="11.25" y="10.5" width="1.5" height="2" rx="0.75" fill="#ffffff" />
